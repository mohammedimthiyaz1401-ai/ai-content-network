# daily_morning.yml
# Daily shorts: 1 short video per day (Mon-Fri)
# Runs at 06:00 UTC every weekday

name: Daily Shorts

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Mon-Fri at 6 AM UTC (11:30 AM IST)
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Pipeline (Shorts Only)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_TIER: ${{ vars.FREE_TIER }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID_CH1 }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          YOUTUBE_CHANNEL_ID_CH2: ${{ secrets.YOUTUBE_CHANNEL_ID_CH2 }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
          YOUTUBE_CHANNEL_ID_CH3: ${{ secrets.YOUTUBE_CHANNEL_ID_CH3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAGGLE_ACCOUNTS: ${{ secrets.KAGGLE_ACCOUNTS }}
          LONGFORM_TARGET: '0'
          SHORTS_TARGET: '1'
        run: python src/main_pipeline.py
        timeout-minutes: 120

      - name: Generate report
        if: always()
        run: |
          echo "## Daily Shorts Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/reports/channel_1_latest.txt ]; then
            cat data/reports/channel_1_latest.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "### No report generated (pipeline failed before reporting)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-${{ github.run_number }}
          path: |
            data/videos/
            data/scripts/
            data/reports/
          retention-days: 7
